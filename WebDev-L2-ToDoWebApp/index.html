
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <h1>My Tasks</h1>
            <p>Organise your day, one task at a time.</p>
        </header>

        <form id="task-form" class="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                maxlength="150"
                required
            >
            <button type="submit">+ Add Task</button>
        </form>

        <section class="task-section">
            <div class="section-header">
                <h2>Pending Tasks</h2>
                <span id="pending-count">0 pending</span>
            </div>

            <ul id="pending-list" class="task-list"></ul>
        </section>

        <section class="task-section">
            <div class="section-header">
                <h2>Completed Tasks</h2>
                <span id="completed-count">0 completed</span>
            </div>

            <ul id="completed-list" class="task-list"></ul>
        </section>

        <footer>
            <p>#HMG. Stay productive!</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
