<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter-container">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures quickly and easily.</p>

        <form id="converterForm" novalidate>

            <label for="temperature">Enter Temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature value"
                step="any"
                required
            >

            <label for="unit">Select Input Unit</label>
            <select id="unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Convert Temperature</button>

            <p id="errorMessage" class="error" role="alert"></p>

        </form>

        <section id="results" class="results" aria-live="polite" hidden>
            <h2>Conversion Results</h2>

            <div class="result-item">
                <span>Celsius</span>
                <strong id="celsiusResult">--</strong>
            </div>

            <div class="result-item">
                <span>Fahrenheit</span>
                <strong id="fahrenheitResult">--</strong>
            </div>

            <div class="result-item">
                <span>Kelvin</span>
                <strong id="kelvinResult">--</strong>
            </div>
        </section>

        <footer>
            <p>Temperature Converter | HMG 2026</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
